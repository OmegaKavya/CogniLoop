[pytest]
# Only `tests/` holds tests. `scripts/` holds hand-run probes, and one of them
# is named test_ollama.py and performs a network request at import time, so a
# bare `pytest` collected it and the whole run died with a ConnectionError the
# moment the Ollama service was not listening. Collection should not depend on
# a background daemon being up.
testpaths = tests
