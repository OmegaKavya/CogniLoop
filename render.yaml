services:
  - type: web
    name: cogniloop
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      # Postgres connection string, set by hand in the dashboard rather than
      # committed. With it unset the app falls back to JSON files on the
      # container filesystem, which this tier erases on every deploy, restart
      # and idle spin-down.
      - key: DATABASE_URL
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: OLLAMA_ENABLED
        value: "false"
      - key: RAG_ENABLED
        value: "false"
